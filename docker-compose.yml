services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oportunidades-automacao-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=file:/data/app.db
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
    driver: local
