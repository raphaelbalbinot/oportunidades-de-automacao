stages:
  - test
  # - build
  # - migrate
  # - deploy

variables:
  GIT_SSL_NO_VERIFY: "true"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# ---------------------------------------------------------
# Test & Typecheck
# ---------------------------------------------------------
test:typecheck:
  stage: test
  image: hub.estaleiro.serpro/pipeline/node:22
  before_script:
    - npm ci
    - npx prisma generate
  script:
    - npx tsc --noEmit
    - npm run build:server
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: "$CI_COMMIT_BRANCH"

