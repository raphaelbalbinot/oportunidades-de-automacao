stages:
  - test
  - build
  - migrate
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# ---------------------------------------------------------
# Test & Typecheck
# ---------------------------------------------------------
test:typecheck:
  stage: test
  image: node:22-alpine
  before_script:
    - npm ci
    - npx prisma generate
  script:
    - npx tsc --noEmit
    - npm run build:server
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------
# Build Docker Image
# ---------------------------------------------------------
build:docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

# ---------------------------------------------------------
# Database Migrations
# ---------------------------------------------------------
migrate:database:
  stage: migrate
  image: node:22-alpine
  environment:
    name: production
  script:
    - npm ci
    - npx prisma migrate deploy
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  when: manual

# ---------------------------------------------------------
# Deploy
# ---------------------------------------------------------
deploy:production:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://automacao.corporativo.gov.br
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Implantando versão $CI_COMMIT_SHORT_SHA em produção..."
    # Exemplo: Chamada de Webhook de Deploy ou comando SSH / Kubernetes
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  when: manual
